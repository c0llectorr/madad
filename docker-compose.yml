services:
  postgres:
    image: postgres:16-alpine
    container_name: madad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: madad123
      POSTGRES_DB: madad
    ports:
      - "5432:5432"
    volumes:
      - madad_pg_data:/var/lib/postgresql/data
      - ./database/postgres/migrations/001_initial.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/postgres/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d madad"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  madad_pg_data:
